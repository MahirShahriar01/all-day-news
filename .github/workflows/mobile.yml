# Builds the Flutter app.
#
#   * Every push / PR: analyse + unit/widget tests.
#   * Every push and manual run: Android APK + App Bundle (.aab) as
#     downloadable workflow artifacts; iOS compile check (unsigned).
#   * Tags like v1.2.3: also attaches the APK and AAB to a GitHub Release.
#
# Optional repository settings (Settings → Secrets and variables → Actions):
#   Variables: API_BASE_URL               e.g. https://news.example.com
#   Secrets:   ANDROID_KEYSTORE_BASE64    base64 of upload-keystore.jks
#              ANDROID_KEYSTORE_PASSWORD
#              ANDROID_KEY_ALIAS
#              ANDROID_KEY_PASSWORD
# Without API_BASE_URL the app runs on its built-in demo content.
# Without the keystore secrets the release is signed with a debug key: fine
# for installing the APK on a phone, not accepted by Google Play.
name: Mobile app

on:
  push:
    paths: ["app/**", ".github/workflows/mobile.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["app/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure release signing (if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release keystore configured."
          else
            echo "::warning::No keystore secrets set - the build is signed with a debug key (installable, not Play-uploadable)."
          fi
      - run: flutter pub get
      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Build App Bundle (.aab)
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Collect outputs
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/all-in-one-news.apk
          cp build/app/outputs/bundle/release/app-release.aab ../dist/all-in-one-news.aab
          (cd ../dist && sha256sum * > SHA256SUMS.txt && ls -la)
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-one-news-android
          path: dist/
          if-no-files-found: error
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/all-in-one-news.apk
            dist/all-in-one-news.aab
            dist/SHA256SUMS.txt
    permissions:
      contents: write

  ios:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned compile check)
        run: >
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      # Signed builds for the App Store are made in Xcode or with an
      # App Store Connect API key; see docs/11-app-store-release.md.
