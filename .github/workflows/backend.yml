name: Backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: allinone
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: allinone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allinone" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://allinone:pw@localhost:5432/allinone_test' || '' }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then unset TEST_DATABASE_URL; fi
          python -m pytest -q
