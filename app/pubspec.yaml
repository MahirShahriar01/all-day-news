name: all_in_one_news
description: "All in One News - every channel, one place."
publish_to: 'none'

# version: <versionName>+<versionCode>. Increase the number after "+" for
# every upload to Google Play / App Store Connect (see docs/10 and docs/11).
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  cached_network_image: ^4.0.4
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/config/fallback_config.json

# ---------------------------------------------------------------------------
# App icons:     dart run flutter_launcher_icons
# Splash screen: dart run flutter_native_splash:create
# Replace the PNGs in assets/images/ with your own artwork and re-run both.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  adaptive_icon_monochrome: assets/images/app_icon_foreground.png

flutter_native_splash:
  color: "#0A0E1A"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0A0E1A"
    image: assets/images/app_icon_foreground.png
    icon_background_color: "#0A0E1A"
  ios: true
  android: true
  fullscreen: false
